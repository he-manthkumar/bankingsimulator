
x-airflow-common: &airflow-common
  build:
    context: ./fastapi-service
    dockerfile: airflow.Dockerfile
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password@postgres:5432/airflow
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIjD-0=
    - AIRFLOW__WEBSERVER__SECRET_KEY=banking-simulator-secret-2024
    - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
    - POSTGRES_HOST=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=banking
    - MONGO_URI=mongodb://banking-mongo:27017
    - MONGO_DB=banking
  volumes:
    - ./fastapi-service/dags:/opt/airflow/dags  
    - airflow-logs:/opt/airflow/logs
  networks:
    - banking-net
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: banking-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: banking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  spring-boot-service:
    build: ./spring-boot-service
    container_name: core-banking
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - banking-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gin-service:
    build: ./gin-service
    container_name: transfer-processor
    ports:
      - "8081:8081"
    environment:
      - MONGO_URI=mongodb://banking-mongo:27017
      - MONGO_DB=banking
      - SPRING_BOOT_URL=${SPRING_BOOT_URL}
      - TEMPORAL_HOST=host.docker.internal:7233
    networks:
      - banking-net
    depends_on:
      mongo:
        condition: service_healthy
      spring-boot-service:
        condition: service_started
    restart: unless-stopped

  fastapi-service:
    build: ./fastapi-service
    container_name: fraud-analytics
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPRING_BOOT_URL=${SPRING_BOOT_URL}
    networks:
      - banking-net
    restart: unless-stopped

  streamlit-service:
    build: ./streamlit-service
    container_name: banking-frontend
    ports:
      - "8501:8501"
    environment:
      - SPRING_BOOT_URL=${SPRING_BOOT_URL}
      - GIN_URL=${GIN_URL}
      - FASTAPI_URL=${FASTAPI_URL}
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=password
      - PG_DB=banking
      - AIRFLOW_URL=http://airflow-webserver:8080
    networks:
      - banking-net
    depends_on:
      spring-boot-service:
        condition: service_started
      gin-service:
        condition: service_started
      fastapi-service:
        condition: service_started
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command: -c "PGPASSWORD=password psql -h postgres -U postgres -d postgres -c 'CREATE DATABASE airflow' 2>/dev/null || echo 'airflow DB already exists' && airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@banking.local 2>/dev/null || true && echo 'Airflow init complete'"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  airflow-logs:

networks:
  banking-net:
    driver: bridge