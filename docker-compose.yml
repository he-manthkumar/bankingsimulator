
# Shared Airflow config — all 3 Airflow containers use this block
x-airflow-common: &airflow-common
  build:
    context: ./fastapi-service
    dockerfile: airflow.Dockerfile
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password@postgres:5432/airflow
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nIjD-0=
    - AIRFLOW__WEBSERVER__SECRET_KEY=banking-simulator-secret-2024
    - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
    - POSTGRES_HOST=postgres
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=banking
    - MONGO_URI=mongodb://banking-mongo:27017
    - MONGO_DB=banking
  volumes:
    - ./fastapi-service/dags:/opt/airflow/dags   # DAGs live in fastapi-service/dags/
    - airflow-logs:/opt/airflow/logs
  networks:
    - banking-net
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy

services:

  # ── Databases ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: banking-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: banking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Core Services ──────────────────────────────────────────────────────────

  spring-boot-service:
    build: ./spring-boot-service
    container_name: core-banking
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - banking-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gin-service:
    build: ./gin-service
    container_name: transfer-processor
    ports:
      - "8081:8081"
    environment:
      - MONGO_URI=mongodb://banking-mongo:27017
      - MONGO_DB=banking
      - SPRING_BOOT_URL=${SPRING_BOOT_URL}
      - TEMPORAL_HOST=host.docker.internal:7233
    networks:
      - banking-net
    depends_on:
      mongo:
        condition: service_healthy
      spring-boot-service:
        condition: service_started
    restart: unless-stopped

  fastapi-service:
    build: ./fastapi-service
    container_name: fraud-analytics
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SPRING_BOOT_URL=${SPRING_BOOT_URL}
    networks:
      - banking-net
    restart: unless-stopped

  streamlit-service:
    build: ./streamlit-service
    container_name: banking-frontend
    ports:
      - "8501:8501"
    environment:
      - SPRING_BOOT_URL=${SPRING_BOOT_URL}
      - GIN_URL=${GIN_URL}
      - FASTAPI_URL=${FASTAPI_URL}
      - PG_HOST=postgres
      - PG_USER=postgres
      - PG_PASSWORD=password
      - PG_DB=banking
    networks:
      - banking-net
    depends_on:
      spring-boot-service:
        condition: service_started
      gin-service:
        condition: service_started
      fastapi-service:
        condition: service_started
    restart: unless-stopped

  # ── Airflow (ETL) ──────────────────────────────────────────────────────────
  # DAGs live in: fastapi-service/dags/
  # Airflow UI:   http://localhost:8083  (admin / admin)

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: >
      bash -c "
        pip install psycopg2-binary pymongo --quiet &&
        python -c \"
import psycopg2, sys
from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
try:
    conn = psycopg2.connect(host='postgres', user='postgres', password='password', database='postgres')
    conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
    cur = conn.cursor()
    cur.execute(\\\"SELECT 1 FROM pg_database WHERE datname='airflow'\\\")
    if not cur.fetchone():
        cur.execute('CREATE DATABASE airflow')
        print('Created airflow database')
    else:
        print('airflow database already exists')
    conn.close()
except Exception as e:
    print(f'DB init error: {e}', file=sys.stderr)
    sys.exit(1)
        \" &&
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@banking.local || true &&
        echo 'Airflow initialised successfully'
      "
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8083:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  airflow-logs:

networks:
  banking-net:
    driver: bridge